<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通用标注平台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="title">
          <div class="h1">通用标注平台</div>
          <div class="sub" id="metaLine">加载中…</div>
        </div>
        <div class="actions">
          <input id="datasetFile" type="file" accept=".json,.jsonl,.xlsx,.xls" />
          <button id="uploadBtn" type="button">上传数据</button>
          <div class="saveModeCtl">
            <span class="fieldLbl">存盘模式</span>
            <select id="saveModeSel" title="auto：每次修改自动写入工作文件；manual：手动点击保存">
              <option value="manual">手动</option>
              <option value="auto">自动</option>
            </select>
          </div>
          <button id="templateBtn" type="button">模版设置</button>
          <button id="saveBtn" class="primary">下载结果</button>
        </div>
      </header>

      <div class="shell" id="shell">
        <aside class="sidebar" id="sidebar" aria-label="case 列表">
          <div class="sidebarHead">
            <div class="sidebarTitle">Case 列表</div>
            <button id="sidebarToggle" type="button" class="iconBtn" aria-expanded="true" title="收起/展开侧边栏">
              收起
            </button>
          </div>

          <div class="listPane">
            <div class="listFilters">
              <div class="listFilterRow">
                <input id="q" type="text" placeholder="全文搜索（回车确认）" />
                <select id="filterChanged" title="按是否已修改筛选">
                  <option value="any">全部</option>
                  <option value="yes">已修改</option>
                  <option value="no">未修改</option>
                </select>
                <select id="pageSize" title="每页条数">
                  <option value="20">20/页</option>
                  <option value="30" selected>30/页</option>
                  <option value="50">50/页</option>
                  <option value="100">100/页</option>
                </select>
              </div>
              <div id="dataFilters" class="dataFilters"></div>
            </div>
            <div class="listHeader">
              <div id="listSummary">—</div>
              <div class="pager">
                <button id="prevBtn">上一页</button>
                <button id="nextBtn">下一页</button>
              </div>
            </div>
            <div id="list" class="list"></div>
          </div>
        </aside>

        <main class="workspace" id="workspace">
          <!-- 标注视图 -->
          <section class="detailPane" id="annotateView">
            <div class="detailHeader">
              <div class="detailTitleWrap">
                <div class="h2" id="detailTitle">标注工作区</div>
                <button id="labelledTag" type="button" class="labelTag hidden"
                        title="点击切换已标注 / 未标注"></button>
              </div>
              <div class="detailActions">
                <button id="addFieldBtn" type="button" title="给当前记录新增一个 key">+ 新增字段</button>
                <button id="applyBtn" class="primary">保存此条</button>
              </div>
            </div>
            <div class="detailScroll">
              <div id="detailEmpty" class="empty">请在左侧选择一条记录</div>
              <div id="detail" class="detail hidden">
                <div id="fieldsContainer"></div>
                <div id="applyMsg" class="msg"></div>
              </div>

              <!-- 模型验证（标注的后续过程；是否显示及模型/提示词配置均在模版设置中） -->
              <div id="inferSection" class="inferSection hidden">
                <div class="h3">模型验证</div>
                <div class="inferPanel">
                  <div class="inferHint msg" id="inferInfoLine"></div>
                  <div class="inferActions">
                    <button id="runInferBtn" class="primary" type="button">运行模型验证</button>
                    <span id="inferStatus" class="msg"></span>
                  </div>
                  <div class="inferResultWrap">
                    <span class="promptLabel">模型回复</span>
                    <textarea id="inferResult" rows="8" readonly placeholder="验证结果将显示在这里"></textarea>
                  </div>
                </div>
              </div>

              <!-- 上一条 / 下一条快捷切换（点击时自动保存当前条目） -->
              <div id="rowNav" class="rowNav hidden">
                <button id="prevRowBtn" type="button">← 上一条</button>
                <span id="rowNavPos" class="rowNavPos"></span>
                <button id="nextRowBtn" type="button">下一条 →</button>
              </div>
            </div>
          </section>

          <!-- 模版设置视图 -->
          <section class="detailPane hidden" id="templateView">
            <div class="detailHeader">
              <div class="h2">模版设置</div>
              <div class="detailActions">
                <button id="tplRegenBtn" type="button" title="根据当前数据重新自动解析字段">重新解析字段</button>
                <button id="tplSaveBtn" class="primary">保存模版</button>
              </div>
            </div>
            <div class="detailScroll">
              <div class="tplSection">
                <div class="tplSectionTitle">模版复用</div>
                <div class="tplLibrary">
                  <div class="control tplPickerControl">
                    <label for="tplPicker">选择已有模版</label>
                    <select id="tplPicker"></select>
                  </div>
                  <button id="tplUseBtn" type="button">套用选中模版</button>
                  <button id="tplSaveAsBtn" type="button">另存为新模版</button>
                </div>
                <div class="tplHint" id="tplLibraryHint"></div>
              </div>

              <div class="tplSection">
                <div class="tplSectionTitle">全局设置</div>
                <div class="tplGlobal">
                  <div class="control">
                    <label for="tplTitleField">列表标题字段</label>
                    <select id="tplTitleField"></select>
                  </div>
                  <div class="control">
                    <label for="tplSubtitleField">列表副标题字段</label>
                    <select id="tplSubtitleField"></select>
                  </div>
                  <div class="control">
                    <label for="tplTagField">列表标签字段</label>
                    <select id="tplTagField"></select>
                  </div>
                  <div class="control">
                    <label for="tplSaveMode">存盘模式</label>
                    <select id="tplSaveMode">
                      <option value="manual">手动（点击"保存到文件"才写盘）</option>
                      <option value="auto">自动（每次修改立即写入工作文件）</option>
                    </select>
                  </div>
                  <div class="control">
                    <label for="tplInferEnabled">模型推理</label>
                    <select id="tplInferEnabled">
                      <option value="false">关闭（仅标注）</option>
                      <option value="true">启用（标注后加入模型验证环节）</option>
                    </select>
                  </div>
                </div>
                <div class="tplHint" id="tplPathHint"></div>
              </div>

              <!-- 模型推理配置：启用模型推理后必须在此配置模型与提示词 -->
              <div class="tplSection hidden" id="tplInferSection">
                <div class="tplSectionTitle">模型推理配置（标注 → 模型验证）</div>
                <div class="tplGlobal">
                  <div class="control">
                    <label for="tplInferMode">推理方式</label>
                    <select id="tplInferMode">
                      <option value="api">调用 API</option>
                      <option value="local">本地模型</option>
                    </select>
                  </div>
                  <div class="control">
                    <label for="tplInferModel">模型名</label>
                    <input id="tplInferModel" type="text" placeholder="如 gpt-4o / Qwen2.5-7B-Instruct" />
                  </div>
                  <div class="control">
                    <label for="tplInferBaseUrl">Base URL</label>
                    <input id="tplInferBaseUrl" type="text" placeholder="OpenAI 兼容接口地址" />
                  </div>
                  <div class="control">
                    <label for="tplInferTemperature">温度</label>
                    <input id="tplInferTemperature" type="number" step="0.1" min="0" value="0" />
                  </div>
                </div>
                <div class="tplHint" id="tplInferKeyHint"></div>

                <div class="inferPrompt">
                  <div class="inferPromptHead">
                    <span class="promptLabel">系统提示词</span>
                    <select id="tplSysPromptSource" title="选择系统提示词来源">
                      <option value="input">手动输入</option>
                      <option value="file">从文件读取</option>
                    </select>
                    <input id="tplSysPromptFile" type="file" accept=".txt,.md,.json,.jsonl" class="hidden" />
                    <span id="tplSysPromptFileName" class="inferFileName"></span>
                  </div>
                  <textarea id="tplSysPromptText" rows="3" placeholder="系统提示词（可留空）"></textarea>
                </div>

                <div class="inferPrompt">
                  <div class="inferPromptHead">
                    <span class="promptLabel">用户提示词</span>
                    <select id="tplUserPromptSource" title="选择用户提示词来源">
                      <option value="input">手动输入</option>
                      <option value="file">从文件读取</option>
                    </select>
                    <input id="tplUserPromptFile" type="file" accept=".txt,.md,.json,.jsonl" class="hidden" />
                    <span id="tplUserPromptFileName" class="inferFileName"></span>
                  </div>
                  <textarea id="tplUserPromptText" rows="5"
                    placeholder="用户提示词（运行验证时必填）。可用 {字段key} 占位符引用当前条目的字段值，如 {input}、{meta.charge}"></textarea>
                </div>
              </div>

              <div class="tplSection">
                <div class="tplSectionTitle">字段配置（拖动手柄调整顺序）</div>
                <div class="tplTableHead">
                  <div></div>
                  <div>key</div>
                  <div>显示名</div>
                  <div title="以灰色小字显示在字段名旁的输入提示">输入提示</div>
                  <div>控件</div>
                  <div>高度(行)</div>
                  <div>选项（select 用，每行一个）</div>
                  <div>可改</div>
                  <div>隐藏</div>
                  <div title="填入组名；相邻且组名相同的字段将在工作区中并列一行（可两个以上）">并列组</div>
                  <div title="在左侧 case 列表中提供该字段的筛选控件">筛选</div>
                  <div></div>
                </div>
                <div id="tplFields"></div>
                <button id="tplAddFieldBtn" type="button" class="tplAddBtn">+ 添加字段</button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
